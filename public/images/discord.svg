<svg
    viewBox="0 0 256 256"
    xmlns="http://www.w3.org/2000/svg"
    preserveAspectRatio="xMidYMid meet">

    <defs>
        <!-- Old paper -->
        <filter id="paperTexture" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence
                type="fractalNoise"
                baseFrequency="0.025"
                numOctaves="4"
                seed="28"
                result="noise"/>

            <feColorMatrix
                in="noise"
                type="matrix"
                values="
                    0.35 0 0 0 0.55
                    0 0.30 0 0 0.40
                    0 0 0.20 0 0.20
                    0 0 0 0.35 0"
                result="paperNoise"/>

            <feBlend
                in="SourceGraphic"
                in2="paperNoise"
                mode="multiply"/>
        </filter>

        <!-- Rough old ink -->
        <filter id="oldInk" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence
                type="fractalNoise"
                baseFrequency="0.045"
                numOctaves="3"
                seed="1928"
                result="inkNoise"/>

            <feDisplacementMap
                in="SourceGraphic"
                in2="inkNoise"
                scale="1.8"
                xChannelSelector="R"
                yChannelSelector="G"/>

            <feTurbulence
                type="fractalNoise"
                baseFrequency="0.12"
                numOctaves="2"
                seed="7"
                result="grain"/>

            <feComposite
                in="grain"
                in2="SourceGraphic"
                operator="in"
                result="grainMask"/>

            <feBlend
                in="SourceGraphic"
                in2="grainMask"
                mode="multiply"/>
        </filter>

        <!-- Subtle print fade -->
        <filter id="printFade" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence
                type="fractalNoise"
                baseFrequency="0.035"
                numOctaves="3"
                seed="1928"
                result="noise"/>

            <feColorMatrix
                in="noise"
                type="saturate"
                values="0"
                result="grayNoise"/>

            <feComponentTransfer in="grayNoise">
                <feFuncA type="table"
                    tableValues="0.15 0.65"/>
            </feComponentTransfer>

            <feBlend
                in="SourceGraphic"
                in2="grayNoise"
                mode="multiply"/>
        </filter>

        <!-- Paper color -->
        <radialGradient id="paper" cx="50%" cy="45%" r="75%">
            <stop offset="0%" stop-color="#ead39b"/>
            <stop offset="70%" stop-color="#d8b96f"/>
            <stop offset="100%" stop-color="#b89451"/>
        </radialGradient>

        <!-- Vintage ink -->
        <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#28334c"/>
            <stop offset="50%" stop-color="#35415d"/>
            <stop offset="100%" stop-color="#202a40"/>
        </linearGradient>

